name: CI/CD Portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Calculer la version
        run: echo "VERSION=v${{ github.run_number }}" >> $GITHUB_ENV

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construire et pousser l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-nextjs:${{ env.VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-nextjs:latest

            
  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Déployer avec Docker Compose
        run: |
          docker compose pull
          docker compose up -d
          docker compose ps

      - name: Vérifier la santé
        run: |
          sleep 10
          curl -f http://localhost:3002/api/health
